[workspace]
resolver = "3"
members = ["crates/html-view-cfi", "crates/html-view-core", "crates/html-view-doc", "crates/html-view-load", "crates/html-view-navigate", "crates/html-view-paginate", "crates/html-view-paint", "crates/html-view-select", "crates/html-view-types"]

[workspace.package]
repository = "https://github.com/JohanAnderssonOstling/HtmlViewCore"

[workspace.dependencies]
html-view-cfi = { path = "crates/html-view-cfi" }
html-view-doc = { path = "crates/html-view-doc" }
html-view-load = { path = "crates/html-view-load" }
html-view-navigate = { path = "crates/html-view-navigate" }
html-view-paginate = { path = "crates/html-view-paginate" }
html-view-paint = { path = "crates/html-view-paint" }
html-view-select = { path = "crates/html-view-select" }
html-view-types = { path = "crates/html-view-types" }
html = { package = "html-engine", git = "https://github.com/JohanAnderssonOstling/HtmlEngine" }
kurbo = "0.11.3"
peniko = "0.2.0"
unicode-normalization = "0.1"

# Temporary: the note shaping fix and the table markup restore are on the
# engine's master locally, not yet pushed. Remove once the pin can resolve them.
[patch."https://github.com/JohanAnderssonOstling/HtmlEngine"]
html-engine = { path = "../HtmlEngine/crates/html" }
