[workspace]
exclude = ["adapters"]
resolver = "3"
members = ["crates/html-view-cfi", "crates/skrift-column-paginator", "crates/html-view-doc", "crates/html-view-harness", "crates/html-view-load", "crates/html-view-navigate", "crates/html-view-paginate", "crates/html-view-paint", "crates/html-view-select", "crates/html-view-types"]

[workspace.package]
license = "GPL-3.0-or-later"
repository = "https://github.com/JohanAnderssonOstling/HtmlViewCore"

[workspace.dependencies]
html-view-cfi = { path = "crates/html-view-cfi" }
skrift-column-paginator = { path = "crates/skrift-column-paginator" }
html-view-doc = { path = "crates/html-view-doc" }
html-view-load = { path = "crates/html-view-load" }
html-view-navigate = { path = "crates/html-view-navigate" }
html-view-paginate = { path = "crates/html-view-paginate" }
html-view-paint = { path = "crates/html-view-paint" }
html-view-select = { path = "crates/html-view-select" }
html-view-types = { path = "crates/html-view-types" }
html = { package = "skrift", path = "../HtmlEngine/crates/html", features = ["math-export"] }
kurbo = "0.11.3"
peniko = "0.2.0"
